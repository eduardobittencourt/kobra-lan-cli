name: Package checks
on:
  workflow_call:
    inputs:
      expected-tag:
        type: string
        default: ''
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}
      commit:
        value: ${{ jobs.build.outputs.commit }}
      artifact:
        value: candidate-${{ github.run_id }}-${{ github.run_attempt }}

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
      - name: Prepare locked runtime dependencies
        run: uv sync --locked --no-build --no-install-project
      - name: Verify exported runtime lock
        run: |
          uv export --locked --no-dev --no-emit-project --no-header --no-annotate --format requirements-txt \
            | diff -u requirements-runtime.txt -
      - name: Lint
        run: .venv/bin/ruff check kobra_lan scripts tests
      - name: Offline tests with coverage (no printer access)
        run: |
          .venv/bin/coverage run -m unittest discover -s tests -v
          mkdir -p build/unit-coverage
          .venv/bin/coverage xml -o build/unit-coverage/coverage.xml
          uv export --locked --only-group dev --no-header --no-annotate --format requirements-txt \
            --output-file build/unit-coverage/requirements-dev.txt > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-coverage-${{ github.run_id }}
          overwrite: true
          path: build/unit-coverage/
          if-no-files-found: error
          retention-days: 7
      - name: Shell syntax
        run: sh -n kobra-lan

  build:
    needs: unit
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate source and optional release tag
        id: identity
        env:
          EXPECTED_TAG: ${{ inputs.expected-tag }}
        run: |
          if [ -n "$EXPECTED_TAG" ]; then
            version=$(python3 scripts/release_version.py --tag "$EXPECTED_TAG")
          else
            version=$(python3 scripts/release_version.py)
          fi
          commit=$(git rev-parse HEAD)
          test "$commit" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unit-coverage-${{ github.run_id }}
          path: build/unit-coverage
      - name: Shared Debian build and archive gates
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e VERSION -e SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" debian:13 sh -ec '
              apt-get update
              apt-get install -y --no-install-recommends build-essential debhelper dh-sequence-python3 \
                pybuild-plugin-pyproject python3-all python3-setuptools python3-wheel \
                python3-build python3-venv python3-cryptography ca-certificates lintian
              python3 -m venv build/runtime-download
              build/runtime-download/bin/python -m pip download --require-hashes --only-binary=:all: \
                --requirement requirements-runtime.txt --dest build/runtime-wheels
              # Use the locked dev wheels only for instrumentation in this container.
              build/runtime-download/bin/python -m pip install --require-hashes --only-binary=:all: \
                --requirement build/unit-coverage/requirements-dev.txt --target /coverage-tools
              PYTHONPATH=/coverage-tools python3 -m coverage run --append \
                scripts/check_python.py build/python-acceptance --wheelhouse build/runtime-wheels
              PYTHONPATH=/coverage-tools python3 -m coverage run --append \
                scripts/build_deb.py --output build/debian --tag "v$VERSION"
              PYTHONPATH=/coverage-tools python3 -m coverage run --append \
                scripts/check_deb.py "build/debian/kobra-lan-cli_${VERSION}-1_all.deb"
              mkdir -p build/build-coverage
              PYTHONPATH=/coverage-tools python3 -m coverage xml -o build/build-coverage/build-coverage.xml
              lintian --allow-root "build/debian/kobra-lan-cli_${VERSION}-1_all.deb"
              cd build/debian
              sha256sum --check SHA256SUMS
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-coverage-${{ github.run_id }}
          overwrite: true
          path: build/build-coverage/build-coverage.xml
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/debian/*.deb
            build/debian/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  acceptance:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian:13
            id: debian13
          - distro: ubuntu:24.04
            id: ubuntu2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - name: Provision disposable acceptance image
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          docker build --build-arg DISTRO="$DISTRO" -t kobra-acceptance -f scripts/acceptance.Dockerfile .
      - name: Install, probe and preserve private state without networking
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TARGET_ID: ${{ matrix.id }}
        run: |
          (cd candidate && sha256sum --check SHA256SUMS)
          mkdir reports
          chmod 777 reports
          docker run --rm --network none -v "$PWD/candidate:/artifacts:ro" \
            -v "$PWD/reports:/reports" -e VERSION -e TARGET_ID kobra-acceptance sh -ec '
              env -u PYTHONPATH python3 /accept_deb.py "/artifacts/kobra-lan-cli_${VERSION}-1_all.deb" "$VERSION" \
                --report "/reports/${TARGET_ID}.json"
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: reports/*.json
          if-no-files-found: error
          retention-days: 7
