name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Offline tests (no printer access)
        run: python3 -m unittest discover -s tests -v
      - name: Shell syntax
        run: sh -n kobra-lan
