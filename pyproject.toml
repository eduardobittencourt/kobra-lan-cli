[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kobra-lan-cli"
dynamic = ["version"]
description = "Direct, auditable Anycubic Kobra X LAN upload client"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "Eduardo Bittencourt"}]
requires-python = ">=3.11"
dependencies = ["cryptography>=41"]

[project.scripts]
kobra-lan = "kobra_lan.cli:main"

[project.urls]
Repository = "https://github.com/eduardobittencourt/kobra-lan-cli"
Issues = "https://github.com/eduardobittencourt/kobra-lan-cli/issues"

[tool.setuptools]
packages = ["kobra_lan"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "kobra_lan.__version__"}

[dependency-groups]
dev = [
    "coverage>=7.17.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["tools"]

[tool.ruff.lint]
# Start with syntax errors and Pyflakes; formatting changes are out of scope.
select = ["E9", "F"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["kobra_lan", "scripts"]

[tool.coverage.xml]
output = "coverage.xml"
